[tool.poetry]
name = "cortex-mcp"
version = "1.0.2"
description = "MCP server for Palo Alto Networks Cortex XSIAM and XDR"
authors = []
readme = "README.md"
homepage = "https://github.com/ReverseThrottle/cortex-mcp"
repository = "https://github.com/ReverseThrottle/cortex-mcp"
keywords = ["mcp", "cortex", "xsiam", "xdr", "palo-alto"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Operating System :: OS Independent",
    "Topic :: Security",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
]
packages = [
    { include = "cli.py", from = "src" },
    { include = "main.py", from = "src" },
    { include = "version.py", from = "src" },
    { include = "config", from = "src" },
    { include = "entities", from = "src" },
    { include = "pkg", from = "src" },
    { include = "service", from = "src" },
    { include = "usecase", from = "src" },
]

[tool.poetry.scripts]
cortex-mcp = "cli:main_cli"

[tool.poetry.dependencies]
python = ">=3.12,<4.0"
fastapi = "0.122.0"
uvicorn = { version = "^0.38.0", extras = ["standard"] }
types-requests = "^2.32.0.20250515"
requests = "^2.32.3"
fastmcp = "^2.13.1"
mcp = "^1.21.2"
starlette = "0.50.0"
authlib = "1.6.5"

[tool.poetry.group.dev.dependencies]
ruff = "^0.11.10"
black = "^25.1.0"
mypy = "^1.15.0"
pytest = "^8.3.5"
pre-commit = "^4.2.0"
pytest-asyncio = "^1.2.0"

[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"

[tool.black]
line-length = 120
target-version = ["py312"]

[tool.ruff]
fix = false

[tool.pytest.ini_options]
pythonpath = ["src"]

[tool.ruff.lint]
select = [
    "E",  # pycodestyle errors
    "W",  # pycodestyle warnings
    "F",  # pyflakes
    "I",  # isort
    "B",  # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
]
ignore = [
    "E501" # line too long
]