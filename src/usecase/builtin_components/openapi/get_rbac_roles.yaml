openapi: 3.0.0
paths:
  /public_api/v1/rbac/get_roles:
    post:
      summary: Get RBAC Roles
      description: List the tenant's defined roles, optionally filtered by name.
      operationId: get_rbac_roles
      tags:
        - System
      requestBody:
        description: JSON object containing an optional list of role names under a 'request_data' key. Omit role_names (or pass an empty list) to list all roles.
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                request_data:
                  type: object
                  properties:
                    role_names:
                      type: array
                      items:
                        type: string
                      description: Optional list of specific role names to retrieve. Omit or leave empty to list all roles.
              required:
                - request_data
            examples:
              example_request:
                summary: Example request
                value:
                  request_data:
                    role_names: []
      responses:
        '200':
          description: Successful response containing the list of roles.
          content:
            application/json:
              schema:
                type: object
        '401':
          description: Unauthorized. The API key is missing or invalid.
          content:
            application/json:
              schema:
                type: object
        '403':
          description: Forbidden. The API key does not have the required permissions.
          content:
            application/json:
              schema:
                type: object
